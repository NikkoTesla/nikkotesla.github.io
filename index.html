<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Página personal de Nikko Tesla. Muy pronto, una versión completa del perfil."
    />
    <meta name="theme-color" content="#080b1c" />
    <title>Nikko Tesla · Página personal</title>
    <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-glow page-glow--pink" aria-hidden="true"></div>
    <div class="page-glow page-glow--blue" aria-hidden="true"></div>

    <main class="welcome-card">
      <header class="site-header">
        <a class="brand" href="./" aria-label="Nikko Tesla, inicio">
          <img src="assets/favicon.png" alt="" width="32" height="32" />
          <span>Nikko Tesla</span>
        </a>
        <span class="version-tag">V1.0</span>
      </header>

      <section class="hero" aria-labelledby="welcome-title">
        <div class="logo-shell">
          <div class="logo-ring" aria-hidden="true"></div>
          <img
            class="logo"
            src="assets/NikkoTesla-logo-transparent.png"
            alt="Logo de Nikko Tesla"
          />
        </div>

        <p class="eyebrow">Página personal · En construcción</p>
        <h1 id="welcome-title">Hola, soy <span>Nikko Tesla.</span></h1>
        <p class="intro">
          Gracias por pasar por aquí. Esta es mi página personal; por ahora,
          apenas estamos empezando.
        </p>
        <p class="coming-soon">
          En unos días estaré subiendo una versión completa de mi perfil.
        </p>
      </section>

      <footer class="site-footer">
        <span class="footer-line"></span>
        <span>Nos vemos pronto</span>
        <span class="footer-line"></span>
      </footer>
    </main>
  </body>
</html>
